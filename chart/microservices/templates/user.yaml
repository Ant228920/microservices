apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "microservices.fullname" . }}-user
  labels:
    {{- include "microservices.labels" . | nindent 4 }}
    app.kubernetes.io/component: user
spec:
  replicas: {{ .Values.user.replicaCount }}
  selector:
    matchLabels:
      {{- include "microservices.selectorLabels" (dict "root" . "component" "user") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "microservices.labels" . | nindent 8 }}
        app.kubernetes.io/component: user
    spec:
      containers:
        - name: user-service
          image: "{{ .Values.user.image.repository }}:{{ .Values.user.image.tag }}"
          imagePullPolicy: {{ .Values.user.image.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "microservices.fullname" . }}-config
            - secretRef:
                name: {{ include "microservices.fullname" . }}-secret
          resources:
            {{- toYaml .Values.user.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "microservices.fullname" . }}-user
  labels:
    {{- include "microservices.labels" . | nindent 4 }}
    app.kubernetes.io/component: user
spec:
  type: {{ .Values.user.service.type }}
  selector:
    {{- include "microservices.selectorLabels" (dict "root" . "component" "user") | nindent 4 }}
  ports:
    - port: {{ .Values.user.service.port }}
      targetPort: 8000