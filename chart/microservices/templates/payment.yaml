apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "microservices.fullname" . }}-payment
  labels:
    {{- include "microservices.labels" . | nindent 4 }}
    app.kubernetes.io/component: payment
spec:
  replicas: {{ .Values.payment.replicaCount }}
  selector:
    matchLabels:
      {{- include "microservices.selectorLabels" (dict "root" . "component" "payment") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "microservices.labels" . | nindent 8 }}
        app.kubernetes.io/component: payment
    spec:
      containers:
        - name: payment-service
          image: "{{ .Values.payment.image.repository }}:{{ .Values.payment.image.tag }}"
          imagePullPolicy: {{ .Values.payment.image.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "microservices.fullname" . }}-config
            - secretRef:
                name: {{ include "microservices.fullname" . }}-secret
          resources:
            {{- toYaml .Values.payment.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "microservices.fullname" . }}-payment
  labels:
    {{- include "microservices.labels" . | nindent 4 }}
    app.kubernetes.io/component: payment
spec:
  type: {{ .Values.payment.service.type }}
  selector:
    {{- include "microservices.selectorLabels" (dict "root" . "component" "payment") | nindent 4 }}
  ports:
    - port: {{ .Values.payment.service.port }}
      targetPort: 8000