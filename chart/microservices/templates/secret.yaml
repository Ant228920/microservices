apiVersion: v1
kind: Secret
metadata:
  name: {{ include "microservices.fullname" . }}-secret
  labels:
    {{- include "microservices.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgres:%v/%s" .Values.postgres.user (required "secret.postgresPassword is required" .Values.secret.postgresPassword) (include "microservices.fullname" .) .Values.postgres.service.port .Values.postgres.database | quote }}
  POSTGRES_PASSWORD: {{ required "secret.postgresPassword is required" .Values.secret.postgresPassword | quote }}
  SECRET_KEY: {{ required "secret.secretKey is required" .Values.secret.secretKey | quote }}