apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  namespace: olianiuk-namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: ghcr.io/ant228920/microservices-gateway_service:sha-865266f
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: microservices-config
            - secretRef:
                name: microservices-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: olianiuk-namespace
spec:
  selector:
    app: gateway-service
  ports:
    - port: 8000
      targetPort: 8000